[project]
name = "localx"
version = "0.1.0"
description = "localX P2P TUI chat application"
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit >= 3.0",
    "portalocker >= 2.7",
    "pydantic >= 2.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
    "pyte >= 0.8",
]

[dependency-groups]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
    "pyte >= 0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
