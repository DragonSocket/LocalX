[project]
name = "localx"
version = "0.1.0"
description = "localX P2P TUI chat application"
requires-python = ">=3.12"
dependencies = [
    "textual >= 0.47",
    "aiosqlite >= 0.20",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
]

[dependency-groups]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
